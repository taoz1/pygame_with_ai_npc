<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>最后一班｜AI NPC 2D RPG</title><meta name="description" content="在2040年的榕海，走进和盛智造，认识同事并调查一场即将发生的危机。"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%23131a27'/%3E%3Cpath d='M7 23h18V9H7zm4-10h4v6h-4zm8 0h2v6h-2z' fill='%23f0bb46'/%3E%3C/svg%3E"><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body><header><div><span class="kicker">2040 · 榕海</span><h1>最后一班</h1></div><div class="chapter"><span>序章</span><strong>第一次争执</strong></div></header>
<main><section class="game-shell"><div class="canvas-wrap"><canvas id="game" width="768" height="512" aria-label="和盛智造园区地图"></canvas><div id="prompt" class="prompt" hidden>按 E 交谈</div><div id="toast" class="toast" role="status"></div></div>
<aside><div class="panel-head"><div><span class="label">当前任务</span><h2 id="quest-title">入职第一天</h2></div><span id="ai-badge" class="ai-badge">检测 AI…</span></div><p id="quest-copy" class="quest-copy"></p><div class="progress"><span id="quest-progress"></span></div><div class="divider"></div><span class="label">周予安</span><div class="stats"><div><span>体力</span><b>82</b></div><div><span>归属</span><b id="belonging">05</b></div><div><span>线索</span><b id="clues">00</b></div></div><div class="divider"></div><span class="label">操作</span><ul class="help"><li><kbd>WASD</kbd> / <kbd>方向键</kbd> 移动</li><li><kbd>E</kbd> / <kbd>空格</kbd> 交谈或调查</li><li>走近带名字的人物</li></ul><button id="reset" class="reset">重新开始序章</button></aside></section>
<section class="journal"><div class="journal-head"><div><span class="label">行动记录</span><h2>予安的随身笔记</h2></div><span>今天 08:20</span></div><div id="journal"></div></section></main>
<div id="dialogue" class="dialogue" hidden><div class="dialogue-card" role="dialog" aria-modal="true" aria-labelledby="speaker"><button id="close" class="close" aria-label="关闭">×</button><div class="speaker-row"><div id="portrait" class="portrait"></div><div><span id="speaker-role" class="label"></span><h2 id="speaker"></h2><span id="relation"></span></div></div><div id="speech" class="speech"></div><div id="suggestions" class="suggestions"></div><form id="talk-form"><input id="message" maxlength="160" autocomplete="off" placeholder="你想说什么……" aria-label="对话内容"><button type="submit">说出这句话</button></form><p id="dialogue-status" class="dialogue-status"></p></div></div>
<div class="mobile-controls" aria-label="移动控制"><div class="dpad"><button data-move="up">▲</button><button data-move="left">◀</button><button data-move="down">▼</button><button data-move="right">▶</button></div><button id="mobile-action" class="action">交谈</button></div>
</body></html>
